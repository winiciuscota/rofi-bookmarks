name: Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Check bash syntax
      run: bash -n rofi-bookmarks rofi-bookmarks-launcher

    - name: Run shellcheck
      run: shellcheck -e SC1091 rofi-bookmarks rofi-bookmarks-launcher
